name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate .mcp.json and image tag consistency
        run: |
          set -euo pipefail
          jq -e '.mcpServers.zorba.command == "docker"' .mcp.json >/dev/null
          image="$(jq -er '.mcpServers.zorba.args[] | select(startswith("ghcr.io/zorba-processor/zorba:"))' .mcp.json)"
          echo "image in .mcp.json: $image"
          case "$image" in
            *:latest|*:edge) echo "::error::.mcp.json must pin a version tag, not $image"; exit 1 ;;
          esac
          # Every image reference in the README must be the one in .mcp.json.
          refs="$(grep -o 'ghcr.io/zorba-processor/zorba:[A-Za-z0-9._-]*' README.md | sort -u)"
          echo "image references in README.md:"; echo "$refs"
          [ -n "$refs" ] || { echo "::error::README.md does not reference the image"; exit 1; }
          [ "$refs" = "$image" ] || { echo "::error::README.md and .mcp.json reference different images"; exit 1; }

      - name: Pull the pinned image
        run: docker pull "$(jq -er '.mcpServers.zorba.args[] | select(startswith("ghcr.io/zorba-processor/zorba:"))' .mcp.json)"

      - name: Run the suggested questions through zorba-mcp
        run: tests/run.sh
